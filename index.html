<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

    <header>
        <h1>Bank Management System</h1>
    </header>

    <div class="container small">

        <!-- ========== TABS ========== -->
        <div class="tabs">
            <button id="loginTab" class="tab active" onclick="showTab('login')">Login</button>
            <button id="createTab" class="tab" onclick="showTab('create')">Create Account</button>
        </div>

        <!-- ========== LOGIN ========== -->
        <div id="loginBox" class="box">
            <h2>Customer Login</h2>

            <label>Account Number</label>
            <input type="number" id="loginAcc" placeholder="e.g. 1001">

            <label>PIN (4 digits)</label>
            <input type="password" id="loginPin" maxlength="4" placeholder="****">

            <button onclick="login()">Login</button>
        </div>

        <!-- ========== CREATE ACCOUNT ========== -->
        <div id="createBox" class="box hidden">
            <h2>Open a New Account</h2>

            <label>Full Name</label>
            <input type="text" id="newName">

            <label>Phone Number (10 digits)</label>
            <input type="text" id="newPhone" maxlength="10">

            <label>Set a PIN (4 digits)</label>
            <input type="password" id="newPin" maxlength="4">

            <label>Opening Deposit (minimum 500)</label>
            <input type="number" id="newDeposit" min="500" value="500">

            <button onclick="createAccount()">Create Account</button>
        </div>

        <p class="link"><a href="admin.html">Admin Login</a></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
